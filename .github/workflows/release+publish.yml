name: Release + Publish

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['packages/sdk--release_created'] }}
      tag_name: ${{ steps.release.outputs['packages/sdk--tag_name'] }}

    steps:
      - uses: googleapis/release-please-action@v5
        name: Release
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Run lint + build + test on both Node.js and Bun before publishing.
  ci:
    uses: ./.github/workflows/sdk-ci.yml

  publish:
    name: Publish
    needs: [release, ci]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      id-token: write   # required for npm trusted publishing (OIDC) + automatic provenance

    steps:
      - uses: actions/checkout@v6
        name: Checkout code

      - uses: pnpm/action-setup@v5
        name: Setup pnpm
        with:
          version: 10

      - uses: actions/setup-node@v6
        name: Setup Node
        with:
          node-version: '25.x'
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Rebuild to produce the dist/ output that gets published.
      # Lint and tests were already verified by the ci job above.
      - name: Build
        run: pnpm run build
        working-directory: packages/sdk

      # Authenticates via OIDC — no NPM_TOKEN secret needed.
      # Provenance attestations are generated automatically by the registry.
      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
        working-directory: packages/sdk

  integration-test:
    name: Integration test
    needs: [release, publish]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-slim
    steps:
      - name: Dispatch end-to-end test workflow on paambaati/terraform-provider-gpcloud
        env:
          # This token has `actions: write` permission on paambaati/terraform-provider-gpcloud.
          GH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
          TERRABLY_VERSION: ${{ needs.release.outputs.tag_name }}
        run: |
          gh workflow run e2e-terrably-upgrade.yml \
            --repo paambaati/terraform-provider-gpcloud \
            --ref main \
            --field terrably_version="${TERRABLY_VERSION}"
